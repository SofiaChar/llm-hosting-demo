# Shared LLM endpoint on Valohai
# One execution hosts an open-source LLM (Ollama, OpenAI-compatible API) and exposes port 11434.
# Other executions and notebooks call it over your cloud network's private IPs.
#
# Before running: replace both `environment:` values with your own environment slugs
# (`vh environments` lists them), and allow inbound TCP 11434 between Valohai workers (see README).

- step:
    name: llm-server
    image: ollama/ollama:latest
    # <-- replace: a GPU environment is recommended (e.g. AWS g4dn.xlarge); Ollama uses the GPU automatically.
    #     Use on-demand rather than spot so the server isn't reclaimed. A >=8 vCPU / 16 GB CPU machine also works.
    environment: staging-aws-eu-west-1-g4dn-xlarge
    command:
      - bash server/start_server.sh {parameter-value:model}
    parameters:
      - name: model
        type: string
        default: qwen2.5:1.5b
        description: Ollama model tag to serve (qwen2.5:0.5b is faster on CPU, llama3.2:3b is smarter)
    environment-variables:
      # Agent-level variable: must be defined here (not exported in the command) to take effect.
      # Format is <host-port>:<container-port>
      - name: VH_EXPOSE_PORTS
        default: "11434:11434"
      - name: OLLAMA_KEEP_ALIVE
        default: "-1"          # keep the model loaded in memory forever (no cold starts between requests)
      - name: OLLAMA_NUM_PARALLEL
        default: "4"           # serve several clients at once

- step:
    name: llm-batch-inference
    image: python:3.11-slim
    # <-- replace: any small CPU environment. Consumers need no GPU and no model.
    #     Must be in the same network / security group as the server.
    environment: staging-aws-eu-west-1-t3-medium
    command:
      - pip install --quiet requests
      - python client/batch_inference.py {parameters}
    parameters:
      - name: llm_endpoint
        type: string
        description: "Copy from the llm-server execution log / metadata, e.g. http://10.0.12.34:11434"
      - name: model
        type: string
        default: qwen2.5:1.5b
      - name: client_name
        type: string
        default: team-a
        description: Label for this consumer (e.g. team or project name); used in the output file name
      - name: max_tokens
        type: integer
        default: 200
    inputs:
      - name: prompts
        optional: true
        description: Optional .txt file, one prompt per line. Built-in example prompts are used if empty.
